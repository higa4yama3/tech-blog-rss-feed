name: Generate feeds and site

on:
  push:
    branches: [ main ]
  schedule:
    # 平日: 3時間おき、毎時8分
    - cron: '8 0,3,6,9,12,15,18,21 * * 1-5'
    # 休日: 4時間おき、毎時8分
    - cron: '8 0,4,8,12,16,20 * * 0,6'
  workflow_dispatch:

concurrency:
  group: generate-feed
  cancel-in-progress: false

env:
  # 一時停止中は 'true'。フィード生成を止め、停止中ページだけを公開する。再開時は 'false' に戻す
  SITE_OFFLINE: 'true'

jobs:
  generate-feed:
    name: Generate Feed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main
    - uses: actions/setup-node@v6
      if: env.SITE_OFFLINE != 'true'
      with:
        node-version-file: .tool-versions
        cache: npm
    - run: npm ci
      if: env.SITE_OFFLINE != 'true'
    - uses: ./.github/actions/restore-feed-cache
      if: env.SITE_OFFLINE != 'true'
    - run: npm run feed-generate
      if: env.SITE_OFFLINE != 'true'
    - run: npm run site-prepare
      if: env.SITE_OFFLINE != 'true'
    - run: npm run site-build
      if: env.SITE_OFFLINE != 'true'
    - uses: ./.github/actions/save-feed-cache
      if: env.SITE_OFFLINE != 'true'
    - name: Prepare offline page
      if: env.SITE_OFFLINE == 'true'
      run: |
        mkdir -p public
        cat > public/index.html <<'HTML'
        <!doctype html>
        <html lang="ja">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">
        <title>一時停止中</title>
        </head>
        <body>
        <p>このサイトは一時的に公開を停止しています。</p>
        </body>
        </html>
        HTML
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        # NOTE: 変更履歴が必要な場合は false に変更
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    - name: Create issue on failure
      if: failure()
      run: |
        gh issue create \
          --title "Feed generation failed - $(date '+%Y-%m-%d')" \
          --body "Feed generation or deployment failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
          --label "bug"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
